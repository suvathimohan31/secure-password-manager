spring.application.name=secure-password-manager

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/secure_password_manager?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:spm_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema. Hibernate only checks that entity mappings match it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Do not expose exception details or stack traces in web responses.
server.error.include-message=never
server.error.include-stacktrace=never

server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
