<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unlock vault · Secure Vault</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="card">
    <p class="eyebrow">SECURE VAULT</p>
    <h1>Unlock your vault</h1>
    <p class="muted">Re-enter your master password to decrypt vault entries.</p>
    <p class="notice" th:if="${unlockFailed}">Unable to unlock. Check your master password and account lock status.</p>
    <form th:action="@{/vault/unlock}" th:object="${form}" method="post">
        <label for="password">Master password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        <button type="submit">Unlock vault</button>
    </form>
    <p class="footnote"><a th:href="@{/dashboard}">Back to account</a></p>
</main>
</body>
</html>
