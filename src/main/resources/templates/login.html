<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Secure Vault</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="card">
    <p class="eyebrow">SECURE VAULT</p>
    <h1>Welcome back</h1>
    <p class="muted">Sign in with your account master password.</p>

    <p class="notice success" th:if="${registered}">Account created. You can now sign in.</p>
    <p class="notice" th:if="${param.error}">Sign-in failed. Check your details or try again after the lockout period.</p>
    <p class="notice success" th:if="${param.logout}">You have been signed out.</p>

    <form th:action="@{/login}" method="post">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>

        <label for="password">Master password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Sign in</button>
    </form>
    <p class="footnote">New here? <a th:href="@{/register}">Create an account</a></p>
</main>
</body>
</html>
